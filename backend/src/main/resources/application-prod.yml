spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    enabled: true

logging:
  level:
    com.onlineshop: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework: INFO

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:https://your-frontend.com}

# ==================== Actuator ====================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
    info:
      access: unrestricted
  info:
    env:
      enabled: true