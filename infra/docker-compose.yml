services:
  postgres:
    image: postgres:16-alpine
    container_name: online-shop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: online_shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_secret
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d online_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: online-shop-backend
    depends_on:
      postgres:
        condition:  service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/online_shop
      SPRING_DATASOURCE_USERNAME: shop_user
      SPRING_DATASOURCE_PASSWORD: shop_secret
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
  
  frontend:
    build:
      context: ../frontend
    container_name: online-shop-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data: